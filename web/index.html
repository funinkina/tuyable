<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lamp</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --bg: #111111; --card: #1c1c1e; --track: #2c2c2f; --fg: #f2f2f2; --muted: #8e8e93;
    --line: #2f2f33; --warn: #ff9f43; --light: #ffb86b;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f2; --card: #ffffff; --track: #e6e5e2; --fg: #161616; --muted: #77767b;
            --line: #e2e1de; --warn: #d9480f; color-scheme: light; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh; user-select: none; -webkit-user-select: none;
    padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer;
           touch-action: manipulation; }
  button:focus-visible, .slider:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: 3px; }

  header { display: flex; align-items: center; gap: 16px; }
  header div { flex: 1; min-width: 0; }
  h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  #status { margin: 2px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.err { color: var(--warn); white-space: normal; }

  #power { width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center;
           background: var(--track); color: var(--muted);
           transition: background .25s, color .25s, box-shadow .25s, transform .1s; }
  #power:active { transform: scale(.94); }
  #power svg { width: 30px; height: 30px; }
  .on #power { background: var(--light); color: #1a1a1a; box-shadow: 0 0 0 6px color-mix(in srgb, var(--light) 25%, transparent); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--track); border-radius: 14px; padding: 4px; }
  .seg button { height: 44px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--muted);
                transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px #0003; }

  .row { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px;
         font-size: 14px; color: var(--muted); }
  .row b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .slider { position: relative; display: block; height: 56px; border-radius: 16px; background: var(--track);
            overflow: hidden; }
  .slider { --knob: 44px; }
  #bright-s { background: linear-gradient(90deg, color-mix(in srgb, var(--light) 12%, var(--track)), var(--light)); }
  #temp-s { background: linear-gradient(90deg, #ffb86b, #fff1dc 50%, #cce3ff); }
  .slider .knob { position: absolute; top: 6px; width: var(--knob); height: var(--knob); border-radius: 50%;
                  left: calc(6px + (100% - 12px - var(--knob)) * var(--p, .5)); background: #fff;
                  box-shadow: 0 1px 4px #0005, inset 0 0 0 1px #0001; pointer-events: none; }
  .slider input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0;
                  -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: pan-y; }
  .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 56px; height: 56px; }
  .slider input::-moz-range-thumb { width: 56px; height: 56px; border: 0; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 6px 4px 0; }

  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .chips button { height: 52px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
                  display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 600; font-size: 15px; }
  .chips button:active, .swatches button:active { transform: scale(.96); }
  .chips i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .chips small { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatches button { aspect-ratio: 1; border-radius: 18px; position: relative; transition: transform .1s; }
  .swatches button[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 22px;
                                                 border: 2.5px solid var(--fg); }
  #custom { background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  #custom svg { width: 26px; height: 26px; }
  #picker { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px;
            font-weight: 600; font-size: 15px; cursor: pointer; touch-action: manipulation; }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; border-radius: 16px; }
  #d-sum { margin-left: auto; font-weight: 500; font-size: 14px; color: var(--muted); }
  summary svg { width: 18px; height: 18px; color: var(--muted); flex: none; transition: transform .2s; }
  details[open] summary svg { transform: rotate(180deg); }
  dl { margin: 0; padding: 0 16px; display: grid; grid-template-columns: auto 1fr; }
  dt, dd { padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
  dt { color: var(--muted); padding-right: 12px; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; user-select: text; }
  dd .warn { color: var(--warn); white-space: nowrap; }
  #scan { display: block; margin: 4px 16px 0; width: calc(100% - 32px); height: 48px; border-radius: 12px;
          background: var(--track); font-weight: 600; font-size: 15px; }
  #scan:active { transform: scale(.98); }
  #scan:disabled { opacity: .6; }
  .hint { margin: 8px 16px 14px; font-size: 12px; color: var(--muted); text-align: center; }

  [hidden] { display: none !important; }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .off .dim { opacity: .55; transition: opacity .25s; }
</style>
</head>
<body>
<main id="app">
  <header>
    <div>
      <h1>Lamp</h1>
      <p id="status" aria-live="polite">Connecting…</p>
    </div>
    <button id="power" aria-label="Power" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/>
      </svg>
    </button>
  </header>

  <div class="seg" role="group" aria-label="Mode">
    <button id="m-white" aria-pressed="true">White</button>
    <button id="m-color" aria-pressed="false">Colour</button>
  </div>

  <section class="stack dim">
    <div>
      <div class="row"><span>Brightness</span><b id="b-val">–</b></div>
      <label class="slider" id="bright-s"><span class="knob"></span><input id="bright" type="range" min="0" max="100" aria-label="Brightness"></label>
    </div>

    <div id="white" class="stack">
      <div>
        <div class="row"><span>Temperature</span><b id="t-val">–</b></div>
        <label class="slider" id="temp-s"><span class="knob"></span><input id="temp" type="range" min="0" max="100" aria-label="Temperature, warm to cool"></label>
        <div class="ends"><span>Warm</span><span>Cool</span></div>
      </div>
      <div class="chips" id="presets"></div>
    </div>

    <div id="color" class="swatches" hidden>
      <button id="custom" aria-label="Custom colour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <input id="picker" type="color" tabindex="-1" aria-hidden="true">
  </section>

  <details id="diag">
    <summary>Connection<span id="d-sum"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <dl id="d-list"></dl>
    <button id="scan">Find lamp again</button>
    <p class="hint">Looks the lamp up on the WiFi again. Takes up to 20 seconds.</p>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const S = { on: false, color: false, white: 80, temp: 30, h: 30, s: 100, v: 100, error: null, known: false };
let busy = false, queued = null, editedAt = 0, resync = 0;

const PRESETS = [["Candle", 0, 25], ["Relax", 20, 60], ["Read", 55, 100], ["Focus", 100, 100]];
const COLORS = [[0, 100, "Red"], [25, 100, "Orange"], [42, 100, "Amber"], [56, 100, "Yellow"], [120, 85, "Green"],
                [165, 90, "Teal"], [192, 100, "Cyan"], [220, 100, "Blue"], [252, 85, "Indigo"], [278, 85, "Purple"], [322, 75, "Pink"]];

const hex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, "0")).join("");
function hsv(h, s, v = 100) {  // h 0-360, s/v 0-100 -> "#rrggbb"
  s /= 100; v /= 100;
  const f = n => { const k = (n + h / 60) % 6; return 255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))); };
  return hex(f(5), f(3), f(1));
}
function toHsv(c) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255);
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  const h = !d ? 0 : max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: Math.round((h * 60 + 360) % 360), s: max ? Math.round(d / max * 100) : 0 };
}
const warm = t => hex(255 - 51 * t / 100, 184 + 43 * t / 100, 107 + 148 * t / 100);  // ~2700K amber -> ~6500K
const tempName = t => t < 15 ? "Warm" : t < 40 ? "Soft" : t < 65 ? "Neutral" : t < 88 ? "Cool" : "Daylight";
const lightColor = () => S.color ? hsv(S.h, S.s) : warm(S.temp);

$("presets").append(...PRESETS.map(([name, t, b]) => {
  const el = document.createElement("button");
  el.innerHTML = `<i style="background:${warm(t)}"></i>${name}<small>${b}%</small>`;
  el.onclick = () => { S.color = false; S.temp = t; S.white = b; change(); };
  return el;
}));
$("custom").before(...COLORS.map(([h, s, name]) => {
  const el = document.createElement("button");
  el.style.background = hsv(h, s); el.dataset.h = h; el.dataset.s = s; el.ariaLabel = name;
  el.onclick = () => { S.color = true; S.h = h; S.s = s; change(); };
  return el;
}));

function render() {
  const brightness = S.color ? S.v : S.white, light = lightColor();
  document.body.className = S.on ? "on" : "off";
  document.documentElement.style.setProperty("--light", light);
  $("power").ariaPressed = S.on;
  $("m-white").ariaPressed = !S.color; $("m-color").ariaPressed = S.color;
  $("white").hidden = S.color; $("color").hidden = !S.color;
  $("bright").value = brightness; $("bright").parentNode.style.setProperty("--p", brightness / 100);
  $("temp").value = S.temp; $("temp").parentNode.style.setProperty("--p", S.temp / 100);
  $("b-val").textContent = brightness + "%"; $("t-val").textContent = tempName(S.temp);
  let matched = false;
  for (const el of $("color").querySelectorAll("[data-h]")) {
    const hit = S.color && Math.abs(el.dataset.h - S.h) < 3 && Math.abs(el.dataset.s - S.s) < 3;
    el.ariaPressed = hit; matched ||= hit;
  }
  const custom = S.color && !matched;
  $("custom").ariaPressed = custom;
  $("custom").style.background = custom ? light : ""; $("custom").style.color = custom ? "transparent" : "";
  if (!$("diag").open) $("d-sum").textContent = S.connected ? "On WiFi" : "Not reachable";
  const st = $("status");
  st.className = S.error ? "err" : "";
  st.textContent = S.error ? S.error : !S.known ? "Connecting…" : S.on ? `On · ${brightness}%` : "Off";
}

function payload() {
  return S.color ? { mode: "color", h: S.h, s: S.s, v: S.v } : { mode: "white", b: S.white, t: S.temp };
}
function change(body = payload()) {
  if (body.mode) S.on = true;
  editedAt = Date.now(); render(); send(body);
  clearTimeout(resync); resync = setTimeout(poll, QUIET + 200);  // pick up anything ignored while editing
}

// Latest-wins: one request in flight; newer edits replace the queued one, so drags never back up.
function send(body) { queued = body; if (!busy) pump(); }
async function pump() {
  busy = true;
  while (queued) {
    const body = queued; queued = null;
    try {
      const r = await fetch("/api/set", { method: "POST", headers: { "content-type": "application/json" },
                                          body: JSON.stringify(body), signal: AbortSignal.timeout(45000) });
      const s = await r.json();
      if (!queued) accept(s, true);
    } catch { S.error = "Can't reach the lamp bridge"; render(); }
  }
  busy = false;
}
// The server holds the lamp's state and pushes every change. While this page is being edited
// (and for QUIET ms after) pushes are ignored, so sliders don't jump under a finger.
const QUIET = 1000;
function accept(s, mine = false) {
  if (!mine && (busy || Date.now() - editedAt < QUIET)) return;
  const known = S.known || s.known;
  Object.assign(S, s, { known });  // the reply to our own latest write is the server's state too
  render();
}
async function poll() {
  try { accept(await (await fetch("/api/state", { signal: AbortSignal.timeout(5000) })).json()); }
  catch { S.error = "Can't reach the lamp bridge"; render(); }
}
// Open only while the page is visible: a hidden tab or backgrounded app must not hold one of the
// browser's six connections to this server.
let es = null;
function listen() {
  es?.close(); es = null;
  if (document.visibilityState !== "visible") return;
  es = new EventSource("/api/events");  // reconnects by itself; sends the state on connect
  es.onmessage = e => accept(JSON.parse(e.data));
  es.onerror = () => { S.error = "Can't reach the lamp bridge"; render(); };
}

const esc = t => t.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const ago = s => s == null ? "" : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
const dur = s => s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m`
  : s < 86400 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h`;

function renderDiag(d) {
  const rows = [
    ["Link", d.connected ? "On WiFi" : '<span class="warn">Not reachable</span>'],
    ["Address", d.ip ? `${esc(d.ip)} · found ${ago(d.found_age)}` : "Not found yet"],
    ["Response", d.ms == null ? "–" : `${d.ms} ms`],
    ["Last heard", ago(d.heard_age) || "–"],
    ["Session", d.session_age == null ? "–" : dur(d.session_age)],
    ["Protocol", d.version ? `Tuya LAN ${d.version}` : "–"],
    ["Last error", d.last_error ? `${esc(d.last_error)} · ${ago(d.error_age)}` : "None"],
    ["Writes / sessions / failures", `${d.writes} / ${d.sessions} / ${d.failures}`],
    ["Bridge uptime", dur(d.uptime)],
  ];
  $("d-list").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("d-sum").textContent = d.connected ? "On WiFi" : "Not reachable";
}
async function loadDiag() {
  try { renderDiag(await (await fetch("/api/diag", { signal: AbortSignal.timeout(6000) })).json()); } catch {}
}
$("diag").ontoggle = () => $("diag").open && loadDiag();
$("scan").onclick = async () => {
  const b = $("scan"); b.disabled = true; b.textContent = "Looking…";
  try { renderDiag(await (await fetch("/api/scan", { method: "POST", signal: AbortSignal.timeout(60000) })).json()); }
  catch { S.error = "Can't reach the lamp bridge"; render(); }
  b.disabled = false; b.textContent = "Find lamp again";
};

$("power").onclick = () => { navigator.vibrate?.(10); S.on = !S.on; change({ on: S.on }); };
$("m-white").onclick = () => { if (S.color) { S.color = false; change(); } };
$("m-color").onclick = () => { if (!S.color) { S.color = true; change(); } };
$("bright").oninput = e => { S.color ? S.v = +e.target.value : S.white = +e.target.value; change(); };
$("temp").oninput = e => { S.temp = +e.target.value; change(); };
$("custom").onclick = () => { $("picker").value = hsv(S.h, S.s); $("picker").click(); };
$("picker").oninput = e => { Object.assign(S, toHsv(e.target.value), { color: true }); change(); };

render();
listen();
setInterval(() => document.visibilityState === "visible" && $("diag").open && loadDiag(), 4000);
document.addEventListener("visibilitychange", listen);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
